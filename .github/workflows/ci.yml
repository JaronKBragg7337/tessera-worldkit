name: ci

# Everything the README claims is asserted here. If a claim cannot be run on
# every commit it is labelled unverified in docs/engine-support.md instead of
# being asserted in prose.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core pipeline (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: build with zero dependencies installed
        # Proves the core really is standard library only. If this step needs a
        # pip install, decision 0002 has been broken.
        run: |
          ./tessera doctor --json
          ./tessera build --kit kits/shell_v1 --out build
          ./tessera catalog

      - name: validate every asset
        run: ./tessera validate --no-colour --report build/asset-report.json

      - name: assemble the workshop from metadata alone
        run: python3 examples/workshop_shell/build.py

      - name: validate the assembled layout
        run: |
          ./tessera validate --layout examples/workshop_shell/layout.json \
            --no-colour --report build/layout-report.json

      - name: the build must be byte-identical on re-run
        # SOURCE_DATE_EPOCH pins the only field that is not a pure function of
        # the inputs, so this is a genuine byte comparison rather than one that
        # quietly excludes the parts nobody checked.
        env: { SOURCE_DATE_EPOCH: "1700000000" }
        run: |
          ./tessera build --kit kits/shell_v1 --out build
          cp build/catalog.json /tmp/first.json
          ./tessera build --kit kits/shell_v1 --out build
          diff /tmp/first.json build/catalog.json \
            || (echo "::error::the build is not deterministic"; exit 1)

      - name: the committed catalog must match a fresh build
        run: |
          ./tessera build --kit kits/shell_v1 --out build
          python3 - <<'PY'
          import json, subprocess, sys
          def strip(doc):
              doc.pop("generated_utc", None)
              for a in doc.get("assets", []):
                  a.get("provenance", {}).pop("created_utc", None)
              return doc
          fresh = strip(json.load(open("build/catalog.json")))
          committed = strip(json.loads(subprocess.check_output(
              ["git", "show", "HEAD:build/catalog.json"], text=True)))
          if fresh != committed:
              print("::error::committed catalog is stale; run ./tessera build")
              sys.exit(1)
          print("committed catalog matches a fresh build")
          PY
          git diff --exit-code build/meshes \
            || (echo "::error::committed meshes are stale; run ./tessera build"; exit 1)

      - name: the digest must stay a digest
        # This is NOT a cap on what an agent may read -- modern models have large
        # contexts and real sandboxes. It is a guardrail stopping the brief from
        # silently drifting back into being the catalog, which is the only way it
        # stops being useful.
        #
        # The budget is per asset rather than absolute, because an absolute cap
        # would fire when the kit grows from 12 assets to 45 and report a
        # successful expansion as a failure. Per-asset cost is what actually
        # measures bloat, and it is scale-invariant.
        run: |
          ./tessera brief --format json --out build/brief.json --stats 2>build/brief-stats.json >/dev/null
          cat build/brief-stats.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("build/brief-stats.json"))
          if s["ratio_json"] > 0.15:
              print("::error::brief is %.1f%% of the catalog" % (100 * s["ratio_json"]))
              sys.exit(1)
          assets = json.load(open("build/brief.json"))["asset_count"]
          per_asset = s["approx_tokens_brief_json"] / assets
          if per_asset > 260:
              print("::error::brief costs ~%.0f tokens per asset" % per_asset)
              sys.exit(1)
          print("brief: ~%d tokens for %d assets (~%.0f each), %.1f%% of the catalog"
                % (s["approx_tokens_brief_json"], assets, per_asset,
                   100 * s["ratio_json"]))
          PY

      - name: install test extras
        run: python -m pip install --quiet pytest jsonschema referencing trimesh

      - name: test suite
        run: python -m pytest tests -q

      - name: independently verify every exported mesh
        # A third-party parser, not our own code, confirms the GLB files are
        # watertight, wound outward, and exactly the declared volume.
        run: python3 tools/verify_meshes.py

      - name: refresh cross-implementation ground truth
        run: python3 tools/export_parity.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-py${{ matrix.python }}
          path: |
            build/asset-report.json
            build/layout-report.json
            build/catalog.json
            build/brief.json

  javascript:
    name: javascript adapter agrees with python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: produce the ground truth python decided on
        run: |
          ./tessera build --kit kits/shell_v1 --out build
          python3 examples/workshop_shell/build.py
          python3 tools/export_parity.py
      - name: javascript must reach the same verdicts
        working-directory: adapters/three
        run: npm test

  provenance:
    name: provenance and licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./tessera build --kit kits/shell_v1 --out build
      - name: regenerate the manifest
        run: python3 tools/provenance.py
      - name: no asset may declare an external input
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("provenance/manifest.json"))
          bad = [a["asset"] for a in m["assets"]
                 if a["source_inputs"] or a["origin"] != "original-generated"]
          if bad:
              print("::error::assets with external inputs: %s" % bad)
              sys.exit(1)
          print("all %d assets: origin=original-generated, source_inputs=[]"
                % len(m["assets"]))
          PY
      - name: licence files must exist
        run: test -f LICENSE && test -f LICENSE-CODE && test -f LICENSE-ASSETS

  blender:
    name: blender adapter, verified against a real blender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # bpy ships manylinux wheels for specific CPython versions only.
        with: { python-version: "3.11" }
      - name: cache the blender wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: bpy-5.0.1-py311
      - name: install blender as a python module
        # This is what makes the Blender adapter CI-verifiable rather than
        # "provided and hoped for". No display, no GUI, no manual step.
        run: python -m pip install --quiet bpy==5.0.1
      - name: build the catalog and the two-storey example
        run: |
          python3 tessera build --kit kits/shell_v1 --out build
          python3 examples/safehouse_two_storey/build.py
      - name: verify
        # Checks what comes out the other side, not that the script ran:
        # bounds to the millimetre, triangle counts, collision hull counts,
        # that a doorway's collision is genuinely void where the aperture is,
        # that a whole layout lands at its declared transforms, and that FBX
        # export keeps the UCX_<mesh>_## names Unreal binds collision by.
        run: python3 tools/verify_blender.py

  adapters_parse:
    name: unverified adapters must at least be loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: adapters import without their host
        # The floor, not a claim of support: they parse, they import without
        # bpy/unreal present, and the coordinate maths is exercised. Blender is
        # verified properly in the job above; Unreal and Unity are not, and
        # docs/engine-support.md says so.
        run: |
          python3 - <<'PY'
          import importlib.util, sys
          for name, path in [("tb", "adapters/blender/tessera_blender.py"),
                             ("tu", "adapters/unreal/tessera_unreal.py")]:
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              assert mod.main() == 2, "%s should refuse to run outside its host" % path
              print("ok", path)
          import importlib.util as iu
          spec = iu.spec_from_file_location("tu", "adapters/unreal/tessera_unreal.py")
          tu = iu.module_from_spec(spec); spec.loader.exec_module(tu)
          assert tu.to_unreal_location((1, 2, 3)) == (100.0, -200.0, 300.0)
          assert tu.box_to_unreal([0.0, 0.0, 0.0, 4.0, 0.2, 3.0])[0] == (200.0, -10.0, 150.0)
          assert tu.box_to_unreal([0.0, 0.0, 0.0, 4.0, 0.2, 3.0])[1] == (400.0, 20.0, 300.0)
          assert tu.to_unreal_yaw(90) == -90
          print("ok unreal coordinate conversion")
          PY
      - name: unity package and verification harness are structurally sound
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          editor = Path("adapters/unity/Editor")
          sources = {
              "importer": (editor / "TesseraImporter.cs").read_text(),
              "verify": (editor / "TesseraVerify.cs").read_text(),
          }
          for name, source in sources.items():
              assert source.count("{") == source.count("}"), "%s braces" % name
              assert source.count("(") == source.count(")"), "%s parens" % name

          for needed in ["ToUnity", "BuildColliders", "tessera.catalog/1",
                         "JsonConvert.DeserializeObject"]:
              assert needed in sources["importer"], "missing %s" % needed
          for needed in ["public static void Run()", "CheckBounds",
                         "VerifyCollision", "VerifyLayout",
                         "unity-verify-report.json"]:
              assert needed in sources["verify"], "missing %s" % needed

          package = json.load(open("adapters/unity/package.json"))
          assert package["name"] == "org.tessera.worldkit"
          assert package["dependencies"]["com.unity.nuget.newtonsoft-json"] == "3.2.1"
          project = json.load(open(
              "adapters/unity/verify-project/Packages/manifest.json"))
          assert project["dependencies"]["org.tessera.worldkit"] == "file:../.."
          gltf = project["dependencies"]["org.khronos.unitygltf"]
          assert gltf.endswith("#release/2.14.1"), gltf
          print("ok unity package and executable verification project")
          PY
