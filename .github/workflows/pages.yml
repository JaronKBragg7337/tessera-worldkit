name: public workshop

on:
  push:
    branches: [main]
    paths:
      - "workshop/**"
      - "tools/build_workshop.py"
      - "src/tessera/**"
      - "adapters/three/src/tessera-core.mjs"
      - "build/catalog.json"
      - "build/meshes/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: prove the public inputs before packaging them
        run: |
          ./tessera validate --no-colour
          for layout in examples/*/layout.json; do
            ./tessera validate --layout "$layout" --no-colour
          done

      - name: build the zero-login Workshop
        run: |
          python3 tools/build_workshop.py --out dist
          node --check workshop/app.mjs
          node --check workshop/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: publish
        id: deployment
        uses: actions/deploy-pages@v4
