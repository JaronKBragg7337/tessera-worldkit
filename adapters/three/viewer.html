<!doctype html>
<!-- Tessera reference viewer. SPDX-License-Identifier: 0BSD
     Serve the repository root over HTTP and open /adapters/three/viewer.html
       python3 -m http.server 8000
     It loads the real catalog, the real layout, validates in the browser, and
     draws the collision hulls and traversable apertures so you can see that the
     doorway survived import. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera — Workshop Shell</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d1113; color: #d8e0e4;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 2; max-width: 380px;
         background: #151b1ecc; border: 1px solid #2b3639; border-radius: 8px;
         padding: 12px 14px; backdrop-filter: blur(6px); }
  h1 { font-size: 14px; margin: 0 0 8px; letter-spacing: .04em; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 0; }
  td:last-child { text-align: right; color: #9fb3ba; }
  .ok { color: #63d38c; } .bad { color: #ff6b6b; }
  label { display: block; margin-top: 6px; cursor: pointer; }
  #log { margin-top: 8px; max-height: 180px; overflow: auto; color: #ffb86b; }
</style>
</head>
<body>
<div id="hud"><h1>Tessera — Workshop Shell</h1><div id="stats">loading…</div>
  <label><input type="checkbox" id="showCollision"> collision hulls</label>
  <label><input type="checkbox" id="showApertures" checked> traversable apertures</label>
  <label><input type="checkbox" id="showMesh" checked> meshes</label>
  <div id="log"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { TesseraScene, validateLayout } from './src/tessera-three.mjs';

// Minimal GLB loader: the shipped files use only POSITION/NORMAL/TEXCOORD and
// unsigned-int indices, so a full GLTFLoader is not needed to prove the point.
class TinyGLB {
  async loadAsync(url) {
    const buf = await (await fetch(url)).arrayBuffer();
    const dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0x46546c67) throw new Error('not a GLB');
    let off = 12, json = null, bin = null;
    while (off < dv.byteLength) {
      const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true);
      const chunk = buf.slice(off + 8, off + 8 + len);
      if (type === 0x4e4f534a) json = JSON.parse(new TextDecoder().decode(chunk));
      else if (type === 0x004e4942) bin = chunk;
      off += 8 + len;
    }
    const read = (i, Type, comps) => {
      const acc = json.accessors[i], view = json.bufferViews[acc.bufferView];
      return new Type(bin, (view.byteOffset || 0) + (acc.byteOffset || 0), acc.count * comps);
    };
    const group = new THREE.Group();
    for (const prim of json.meshes[0].primitives) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(read(prim.attributes.POSITION, Float32Array, 3), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(read(prim.attributes.NORMAL, Float32Array, 3), 3));
      g.setIndex(new THREE.BufferAttribute(read(prim.indices, Uint32Array, 1), 1));
      const m = json.materials[prim.material] ?? {};
      const pbr = m.pbrMetallicRoughness ?? {};
      const c = pbr.baseColorFactor ?? [0.7, 0.7, 0.7, 1];
      group.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        color: new THREE.Color(c[0], c[1], c[2]),
        opacity: c[3], transparent: c[3] < 1,
        metalness: pbr.metallicFactor ?? 0, roughness: pbr.roughnessFactor ?? 0.8,
        flatShading: true, side: THREE.DoubleSide,
      })));
    }
    return { scene: new THREE.Group().add(group) };
  }
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1113);
scene.fog = new THREE.Fog(0x0d1113, 40, 110);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
scene.add(new THREE.HemisphereLight(0xbcd8e8, 0x2a2320, 1.5));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.0);
sun.position.set(9, 16, 7); scene.add(sun);
scene.add(new THREE.GridHelper(48, 24, 0x2b3639, 0x1a2124));

const tessera = new TesseraScene({ THREE, GLTFLoader: TinyGLB, baseUrl: '../../build/' });
const catalog = await tessera.loadCatalog('../../build/catalog.json');
const layout = await (await fetch('../../examples/workshop_shell/layout.json')).json();

const report = validateLayout(layout, catalog);
const meshes = await tessera.buildLayout(layout);
const collision = tessera.collisionHelper(layout);
const apertures = tessera.apertureHelper(layout);
collision.visible = false;
scene.add(meshes, collision, apertures);

document.getElementById('stats').innerHTML = `
<table>
<tr><td>assets in kit</td><td>${catalog.asset_count}</td></tr>
<tr><td>triangles in kit</td><td>${catalog.totals.triangles.toLocaleString()}</td></tr>
<tr><td>instances placed</td><td>${layout.instance_count}</td></tr>
<tr><td>solved from contract</td><td>${layout.placement_method.solved_from_contract}</td></tr>
<tr><td>hand-placed</td><td>${layout.placement_method.explicit}</td></tr>
<tr><td>seams discovered</td><td>${layout.discovered_connections ?? '—'}</td></tr>
<tr><td>runtime validation</td><td class="${report.status === 'passed' ? 'ok' : 'bad'}">${report.status}</td></tr>
<tr><td>errors</td><td class="${report.counts.errors ? 'bad' : 'ok'}">${report.counts.errors}</td></tr>
</table>`;
document.getElementById('log').textContent =
  report.diagnostics.map(d => `${d.code}  ${d.what}`).join('\n');

for (const [id, target] of [['showCollision', collision], ['showApertures', apertures], ['showMesh', meshes]]) {
  const el = document.getElementById(id);
  el.onchange = () => { target.visible = el.checked; };
  target.visible = el.checked;
}

// tiny orbit control, no dependency
let theta = 0.9, phi = 1.05, radius = 30;
const centre = new THREE.Vector3(6, 3, -6);
let drag = null;
renderer.domElement.onpointerdown = e => (drag = { x: e.clientX, y: e.clientY });
addEventListener('pointerup', () => (drag = null));
addEventListener('pointermove', e => {
  if (!drag) return;
  theta -= (e.clientX - drag.x) * 0.006;
  phi = Math.max(0.08, Math.min(1.5, phi - (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.onwheel = e => {
  e.preventDefault();
  radius = Math.max(6, Math.min(90, radius * (1 + Math.sign(e.deltaY) * 0.08)));
};
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  camera.position.set(
    centre.x + radius * Math.cos(phi) * Math.cos(theta),
    centre.y + radius * Math.sin(phi),
    centre.z + radius * Math.cos(phi) * Math.sin(theta));
  camera.lookAt(centre);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
